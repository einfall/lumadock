name: Publish prepared release
on:
  push:
    branches: ['release-upload/**']
permissions:
  contents: write
concurrency:
  group: lumadock-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'einfall/lumadock'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: APK verification tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools build-tools;34.0.0'
      - name: Verify and publish prepared APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_staged_release.py
