name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build and test
        run: ./launcher/gradlew -p launcher --no-daemon testReleaseUnitTest lintRelease assembleRelease
